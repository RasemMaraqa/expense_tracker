<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #424141;
      padding: 30px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      
      background-color: #b6b4b4;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 5px;
    }

    .email {
      color: gray;
      margin-bottom: 20px;
    }

    .logout {
      float: right;
      text-decoration: none;
      color: red;
      font-weight: bold;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      background: #f9f9f9;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 5px;
    }
    li:hover {
       border-color: #875fd1;
    border: 2px solid #875fd1;
    box-shadow: 10px 10px 5px rgba(135, 95, 209, 0.2);
    }
    .amount {
      font-weight: bold;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    

    .delete-btn {
      background: none;
      border: none;
      color: red;
      cursor: pointer;
    }

    form {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
    }
    input[type="number"], input[type="text"] {
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    input[type="number"]:hover, input[type="text"]:hover {
       border-color: #875fd1;
    border: 2px solid #875fd1;
    box-shadow: 10px 10px 5px rgba(135, 95, 209, 0.2);
    }
    button {
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
  <script>
    async function deleteExpense(expenseId) {
     const action= await fetch(`/delete_expense/${expenseId}`, {
        method: 'DELETE'
       , headers: {
          'Content-Type': 'application/json'
        }});
      if (!action.ok) {
          alert('Failed to delete expense.');
          return;
        }
      location.reload();
    }
 async function addExpense() {
  console.log("clicked");

  const res = await fetch("/add_expense", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      description: description.value,
      amount: amount.value
    })
  });

  console.log("response", res.status);

  if (res.ok) location.reload();
}


 
  

    </script>
</head>

<body>
  <div class="container">

    <form action="{{ url_for('login.logout') }}" method="post">
  <button type="submit" style="    width: 100%;
    padding: 12px;
    background-color: #50377e;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;">Logout</button>
</form>


    <h1 style="justify-self: center;">Hello, {{ user.username }}</h1>
    <div class="email" style="justify-self: center;">{{ user.email }}</div>

    <h3>Your Expenses</h3>

    {% if expenses %}
      <ul>
        {% for e in expenses %}
          <li>
            <span class="amount">${{ e.amount }}</span>
            <span class="amount">{{ e.description }}</span>

                <button
                  class="delete-btn"
                  type="button"
                  onclick="deleteExpense('{{ e.id }}')">
                   🗑
                </button>

          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p>No expenses yet.</p>
    {% endif %}

    <h3>Add Expense</h3>
    <form onsubmit="return false;">
      <input type="number" step="0.01" id="amount" placeholder="Amount" required>
      <input type="text" step="0.01" id="description" placeholder="Description" required>
      <button type="button" onclick="addExpense()" style="   width: 10%;
      padding: 5px;
    background-color: #50377e;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;"
    onclick="addExpense()">Add</button>


    </form>

        {% if user.is_admin %}
    <div class="admin-box">

      <ul style =" align-content: center; padding-top: 20px;">
        <li><a style="width: 100%;  " href="{{ url_for('user.view_users') }}" >View all users</a></li>
      </ul>
    </div>
    {% endif %}

  </div>


</body>
</html>
