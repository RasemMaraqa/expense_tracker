{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content%}


  <div class="login-box">
    <h2 >Sign in</h2>
    <form action="#" method="POST">
      <input type="text" placeholder="Email" name ="email">
      <input type="password" name="pass" placeholder="Password">
      <div>

        <input type="submit" style="margin-top: 10px;" value="Log in"></input>
      </div>

  
  <div style="text-align:center; margin-top:15px;">
  Don’t have an account?
  <a href="{{ url_for('signup.signup') }}">Sign up</a>
</div>

    </form>

  {% with messaegs = get_flashed_messages() %}
{% if messaegs %}
    {% for message in messaegs %}
        <div style="margin: top -500px; color: red;" class="alert alert-warning" role="info">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}
{% endwith %}

    </div>
  </div>{% endblock %}
