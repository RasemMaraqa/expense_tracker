<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{% endblock %}</title>
<style>
  body {
    margin: 0;
    height: 100vh; 
    display: flex;
    justify-content: center;
    align-items: center;     
    background-color: #424141;
    font-family: Arial, sans-serif;
  }

  .login-box {
    background-color: #b6b4b4;
    padding: 40px;
    text-align: center;
    align-items: center;
    align-content: center;
    align-self: center;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 400px; 
    box-sizing: border-box;
  }
input[type = "submit"]:hover {
    background-color: #6c54b8;
    box-shadow: 10px 10px 5px rgba(135, 95, 209, 0.2);
  }
  input[type = "submit"]{
    width: 100%;
    padding: 12px;
    background-color: #50377e;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
  }
  input[type="text"], input[type="password"] , input[type="email"] {
    width: 93.5%;
    padding: 10px;
    margin: 8px 0 16px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
  }
   input[type="text"]:hover, input[type="password"]:hover , input[type="email"]:hover {
    border-color: #875fd1;
    border: 2px solid #875fd1;
    box-shadow: 10px 10px 5px rgba(135, 95, 209, 0.2);
  }

.container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
.email {
      color: gray;
      margin-bottom: 20px;
    }

    .logout {
      float: right;
      text-decoration: none;
      color: red;
      font-weight: bold;
    }
     .amount {
      font-weight: bold;
    }

    .delete-btn {
      background: none;
      border: none;
      color: red;
      cursor: pointer;
    }
  .login-links {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
  }

  .login-links a {
    text-decoration: none;
    font-weight: bold;
    color: #000;
  }

  .social-login img {
    width: 20px;
    margin-left: 5px;
    vertical-align: middle;
    cursor: pointer;
  }

 
</style>
</head>
<body>
    
    {% block content%}
    {% endblock %}

</body>
</html>
